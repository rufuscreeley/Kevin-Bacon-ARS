name: Publicar web en GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "movies.csv"
      - "stars.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar preparación de datos
        run: python -m unittest discover -s tests
      - name: Preparar el sitio y los datos públicos
        run: python scripts/build_site.py --download-data --output _site
      - name: Validar consultas del grafo con datos reales
        run: node tests/worker-smoke.cjs _site
      - name: Validar distribución de los caminos
        run: node tests/network-layout-smoke.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
